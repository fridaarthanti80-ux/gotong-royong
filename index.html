    <script>
        // Cute Synthesizer sounds for Kids (Using Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSynthSound(type) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'success') {
                    // Upbeat arpeggio
                    const now = audioCtx.currentTime;
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(261.63, now); // C4
                    osc.frequency.setValueAtTime(329.63, now + 0.1); // E4
                    osc.frequency.setValueAtTime(392.00, now + 0.2); // G4
                    osc.frequency.setValueAtTime(523.25, now + 0.3); // C5
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'wrong') {
                    // Sad buzzing sound
                    const now = audioCtx.currentTime;
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'pop') {
                    // Quick bubble pop sound
                    const now = audioCtx.currentTime;
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'sweep') {
                    // Swoosh / sweep sound
                    const now = audioCtx.currentTime;
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.3);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'water') {
                    // Water bubbling effect
                    const now = audioCtx.currentTime;
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.setValueAtTime(600, now + 0.05);
                    osc.frequency.setValueAtTime(550, now + 0.1);
                    osc.frequency.setValueAtTime(700, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch (e) {
                console.log("Audio Context issue", e);
            }
        }

        // WAV Helper function for Gemini TTS
        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function pcmToWav(pcm16, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcm16.length * 2);
            const view = new DataView(buffer);

            // RIFF identifier
            view.setUint32(0, 0x52494646, false); // "RIFF"
            // file length minus RIFF identifier length and file description length
            view.setUint32(4, 36 + pcm16.length * 2, true);
            // RIFF type
            view.setUint32(8, 0x57415645, false); // "WAVE"
            // format chunk identifier
            view.setUint32(12, 0x666d7420, false); // "fmt "
            // format chunk length
            view.setUint32(16, 16, true);
            // sample format (raw)
            view.setUint16(20, 1, true);
            // channel count
            view.setUint16(22, 1, true);
            // sample rate
            view.setUint32(24, sampleRate, true);
            // byte rate (sample rate * block align)
            view.setUint32(28, sampleRate * 2, true);
            // block align (channel count * bytes per sample)
            view.setUint16(32, 2, true);
            // bits per sample
            view.setUint16(34, 16, true);
            // data chunk identifier
            view.setUint32(36, 0x64617461, false); // "data"
            // data chunk length
            view.setUint32(40, pcm16.length * 2, true);

            // write PCM data
            for (let i = 0; i < pcm16.length; i++) {
                view.setInt16(44 + i * 2, pcm16[i], true);
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }

        // Global TTS player variables
        let isMuted = false;
        let currentUtterance = null;
        let activeAudioElement = null;

        // Custom notification system
        function showToast(text, type = "info") {
            const toast = document.getElementById("toast-modal");
            const icon = document.getElementById("toast-icon");
            const txt = document.getElementById("toast-text");
            
            txt.innerText = text;
            if (type === "success") {
                icon.className = "fa-solid fa-circle-check text-emerald-400";
            } else if (type === "error") {
                icon.className = "fa-solid fa-triangle-exclamation text-rose-400";
            } else {
                icon.className = "fa-solid fa-lightbulb text-amber-400";
            }

            toast.style.transform = "translateY(0)";
            toast.style.opacity = "1";
            
            setTimeout(() => {
                toast.style.transform = "translateY(-100px)";
                toast.style.opacity = "0";
            }, 3000);
        }

        // Narration Handler using Gemini 2.5 TTS with local WebSpeech Fallback
        async function playNarration(text) {
            if (isMuted) return;
            stopNarration();

            // Try Gemini TTS first
            try {
                const systemCommand = `Katakan dengan nada riang gembira seperti guru TK/SD ramah yang mengajar anak berumur 6 tahun: ${text}`;
                const payload = {
                    contents: [{
                        parts: [{ text: systemCommand }]
                    }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: {
                            voiceConfig: {
                                prebuiltVoiceConfig: { voiceName: "Sadachbia" } // Bright, Knowledgeable, Lively voice
                            }
                        }
                    },
                    model: "gemini-2.5-flash-preview-tts"
                };

                const apiKey = ""; // Canvas Injector handles authorization key automatically
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("Gemini TTS Network issue, falling back");

                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                const audioData = part?.inlineData?.data;
                const mimeType = part?.inlineData?.mimeType;

                if (audioData && mimeType && mimeType.startsWith("audio/")) {
                    const sampleRate = parseInt(mimeType.match(/rate=(\d+)/)?.[1] || "24000", 10);
                    const pcmData = base64ToArrayBuffer(audioData);
                    const pcm16 = new Int16Array(pcmData);
                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    const audioUrl = URL.createObjectURL(wavBlob);
                    
                    activeAudioElement = new Audio(audioUrl);
                    activeAudioElement.play();
                    return;
                }
            } catch (e) {
                console.log("Using WebSpeech synthesis fallback...", e);
            }

            // Fallback: Web Speech Synthesis API
            if ('speechSynthesis' in window) {
                currentUtterance = new SpeechSynthesisUtterance(text);
                currentUtterance.lang = 'id-ID';
                currentUtterance.rate = 0.9; // Slightly slower for kids
                currentUtterance.pitch = 1.3; // Higher, friendlier tone
                window.speechSynthesis.speak(currentUtterance);
            }
        }

        function stopNarration() {
            if (activeAudioElement) {
                activeAudioElement.pause();
                activeAudioElement = null;
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            const icon = document.getElementById("sound-icon");
            const btn = document.getElementById("btn-sound-toggle");
            if (isMuted) {
                stopNarration();
                icon.className = "fa-solid fa-volume-xmark text-lg";
                btn.className = "w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center transition-all shadow-sm";
                showToast("Suara Narasi Dimatikan");
            } else {
                icon.className = "fa-solid fa-volume-high text-lg";
                btn.className = "w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center transition-all shadow-sm";
                showToast("Suara Narasi Dihidupkan");
                narrateCurrentScreen();
            }
            playSynthSound('pop');
        }
    </script>

    <script>
        // Navigation Router between sections
        function changeSection(section) {
            currentSection = section;
            stopNarration();
            playSynthSound('pop');

            const subTitle = document.getElementById("sub-title");
            const navFooter = document.getElementById("navigation-footer");

            if (section === "menu") {
                subTitle.innerText = "Kelas 1 SD • Pembelajaran Seru";
                navFooter.classList.add("hidden");
                renderMainMenu();
            } else if (section === "materi") {
                subTitle.innerText = "Materi Gotong Royong";
                navFooter.classList.remove("hidden");
                currentMateriIndex = 0;
                renderMateriPage();
            } else if (section === "kuis") {
                subTitle.innerText = "Kuis Pintar";
                navFooter.classList.add("hidden");
                quizCurrentIndex = 0;
                score = 0;
                renderQuizPage();
            } else if (section === "skor") {
                subTitle.innerText = "Papan Prestasi";
                navFooter.classList.add("hidden");
                renderSkorPage();
            }
        }

        // Narrates depending on the section active
        function narrateCurrentScreen() {
            if (isMuted) return;
            if (currentSection === "menu") {
                playNarration("Selamat datang di Petualangan Gotong Royong! Pilih belajar materi, main kuis pintar, atau lihat skor tertinggimu!");
            } else if (currentSection === "materi") {
                const activeMateri = materiPages[currentMateriIndex];
                if (activeMateri && activeMateri.narration) {
                    playNarration(activeMateri.narration);
                }
            } else if (currentSection === "kuis") {
                const activeQuestion = quizQuestions[quizCurrentIndex];
                if (activeQuestion) {
                    playNarration(`Pertanyaan nomor ${quizCurrentIndex + 1}. ${activeQuestion.question}`);
                }
            } else if (currentSection === "skor") {
                playNarration(`Ini adalah halaman prestasimu. Skor tertinggi kamu adalah ${highscore} poin.`);
            }
        }
    </script>

    <script>
        // MATERI SECTION RENDERER
        function renderMateriPage() {
            const screen = document.getElementById("screen-container");
            const activePage = materiPages[currentMateriIndex];

            screen.innerHTML = activePage.render();
            updateMateriNav();

            setTimeout(() => {
                narrateCurrentScreen();
            }, 300);
        }

        function updateMateriNav() {
            const btnBack = document.getElementById("btn-back");
            const btnNext = document.getElementById("btn-next");
            const dotsContainer = document.getElementById("progress-dots");

            // Back button toggles
            if (currentMateriIndex === 0) {
                btnBack.innerHTML = `<i class="fa-solid fa-house"></i> Menu Utama`;
                btnBack.onclick = function() { changeSection('menu'); };
            } else {
                btnBack.innerHTML = `<i class="fa-solid fa-arrow-left"></i> Kembali`;
                btnBack.onclick = function() { goBack(); };
            }

            // Next button toggles
            if (currentMateriIndex === materiPages.length - 1) {
                btnNext.innerHTML = `Main Kuis <i class="fa-solid fa-gamepad"></i>`;
                btnNext.onclick = function() { changeSection('kuis'); };
            } else {
                btnNext.innerHTML = `Lanjut <i class="fa-solid fa-arrow-right"></i>`;
                btnNext.onclick = function() { goNext(); };
            }

            // Dots update
            dotsContainer.innerHTML = materiPages.map((_, idx) => `
                <div class="w-3.5 h-3.5 rounded-full transition-all duration-300 ${idx === currentMateriIndex ? 'bg-sky-500 scale-125' : 'bg-sky-200'}"></div>
            `).join('');
        }

        function goNext() {
            if (currentSection === "materi" && currentMateriIndex < materiPages.length - 1) {
                currentMateriIndex++;
                renderMateriPage();
                playSynthSound('pop');
            }
        }

        function goBack() {
            if (currentSection === "materi" && currentMateriIndex > 0) {
                currentMateriIndex--;
                renderMateriPage();
                playSynthSound('pop');
            }
        }
    </script>

    <script>
        // QUIZ SECTION RENDERER
        function renderQuizPage() {
            const screen = document.getElementById("screen-container");
            const q = quizQuestions[quizCurrentIndex];

            const percent = (quizCurrentIndex / quizQuestions.length) * 100;

            screen.innerHTML = `
            <div class="space-y-4">
                <!-- Quiz Progress header -->
                <div class="flex items-center justify-between text-sm font-bold text-sky-700">
                    <button onclick="confirmExitQuiz()" class="text-rose-500 hover:text-rose-600 flex items-center gap-1.5 active:scale-95 transition-all text-xs">

                    </button>
                    <span>Soal Kuis ${quizCurrentIndex + 1} dari ${quizQuestions.length}</span>
                    <span class="bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-xs">Skor: ${score}</span>
                </div>
                
                <!-- Progress Line -->
                <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden border border-slate-200">
                    <div class="bg-emerald-400 h-full transition-all duration-300" style="width: ${percent}%"></div>
                </div>

                <!-- Card Question Content -->
                <div class="bg-sky-50 rounded-[28px] p-6 border-2 border-sky-200 shadow-md text-center">
                    <div class="text-5xl mb-2 animate-bounce">${q.emoji}</div>
                    <h3 class="text-xl md:text-2xl font-bold text-slate-800 leading-snug">
                        ${q.question}
                    </h3>
                </div>

                <!-- Answer options layout -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 pt-2">
                    ${q.options.map((opt, idx) => `
                        <button onclick="submitAnswer(${idx})" class="p-4 bg-white hover:bg-sky-100 text-sky-900 border-2 border-sky-200 hover:border-sky-400 rounded-2xl font-bold text-sm md:text-base text-center transition-all shadow-sm active:scale-95 duration-200 flex items-center justify-center min-h-[64px]">
                            ${opt.text}
                        </button>
                    `).join('')}
                </div>
            </div>
            `;

            setTimeout(() => {
                narrateCurrentScreen();
            }, 300);
        }

        // Exit confirmation helper using custom toast rather than native alerts
        function confirmExitQuiz() {
            if (confirm("Apakah kamu ingin mengakhiri kuis dan kembali ke Menu Utama?")) {
                changeSection('menu');
            }
        }

        function submitAnswer(optionIndex) {
            const q = quizQuestions[quizCurrentIndex];
            const isCorrect = q.options[optionIndex].isCorrect;

            if (isCorrect) {
                score += 20;
                playSynthSound('success');
                showToast("Hebat! Jawabanmu betul sekali!", "success");
            } else {
                playSynthSound('wrong');
                showToast("Waduh, belum tepat. Ayo coba lagi!", "error");
            }

            setTimeout(() => {
                if (quizCurrentIndex < quizQuestions.length - 1) {
                    quizCurrentIndex++;
                    renderQuizPage();
                } else {
                    saveAndShowResults();
                }
            }, 1200);
        }
    </script>

            let descBadge = "Ayo selesaikan Kuis Pintar untuk mendapatkan Lencana Pertamamu!";

            if (highscore === 100) {
                levelTrophy = `<i class="fa-solid fa-trophy text-amber-400 text-8xl animate-bounce"></i>`;
                levelBadge = "Lencana Bintang Emas 🥇";
                descBadge = "Nilai Sempurna! Kamu adalah Pejuang Gotong Royong Sejati!";
            } else if (highscore >= 80) {
                levelTrophy = `<i class="fa-solid fa-award text-yellow-400 text-8xl"></i>`;
                levelBadge = "Lencana Bintang Perak 🥈";
                descBadge = "Hebat Sekali! Kamu sangat paham cara bekerja sama!";
            } else if (highscore >= 60) {
                levelTrophy = `<i class="fa-solid fa-medal text-amber-600 text-8xl"></i>`;
                levelBadge = "Lencana Bintang Perunggu 🥉";
                descBadge = "Kamu mengerti pentingnya membantu sesama. Keren!";
            } else if (highscore > 0) {
                levelTrophy = `<i class="fa-solid fa-circle-check text-sky-400 text-8xl"></i>`;
                levelBadge = "Lencana Pemula Suka Membantu";
                descBadge = "Terus tingkatkan belajarmu agar dapat Lencana yang lebih tinggi!";
            }

            screen.innerHTML = `
            <div class="text-center py-4 space-y-5 max-w-xl mx-auto">
                <span class="bg-emerald-100 text-emerald-700 px-4 py-1.5 rounded-full font-bold text-xs uppercase tracking-wider">Ruang Penghargaan</span>
                
                <div class="flex justify-center py-2">
                    ${levelTrophy}
                </div>

                <div class="space-y-2">
                    <h3 class="text-2xl font-black text-slate-800">${levelBadge}</h3>
                    <p class="text-sm text-slate-500 max-w-sm mx-auto leading-relaxed">${descBadge}</p>
                </div>

                <!-- Display Box -->
                <div class="bg-sky-50 rounded-3xl p-5 border-2 border-sky-100 grid grid-cols-2 gap-4">
                    <div class="border-r border-sky-200">
                        <span class="text-xs font-bold text-sky-500">SKOR TERTINGGI</span>
                        <h4 class="text-3xl font-black text-sky-800 mt-1">${highscore}</h4>
                    </div>
                    <div>
                        <span class="text-xs font-bold text-sky-500">TANGGAL REKOR</span>
                        <h4 class="text-sm font-bold text-slate-600 mt-2">${highscoreDate}</h4>
                    </div>
                </div>

                <!-- Action buttons -->
                <div class="flex flex-wrap justify-center gap-3 pt-2">
                    <button onclick="resetScore()" class="px-5 py-2.5 bg-rose-100 hover:bg-rose-200 text-rose-600 font-bold rounded-2xl transition-all text-xs active:scale-95">
                        <i class="fa-solid fa-trash-can"></i> Hapus Skor Saya
                    </button>
                    <button onclick="changeSection('menu')" class="px-6 py-3 bg-emerald-400 hover:bg-emerald-500 text-white font-bold rounded-2xl shadow-md transition-all text-sm active:scale-95">
                        <i class="fa-solid fa-house"></i> Menu Utama
                    </button>
                </div>
            </div>
            `;

            setTimeout(() => {
                narrateCurrentScreen();
            }, 300);
        }

        // Score reset helper
        function resetScore() {
            if (confirm("Apakah kamu yakin ingin menghapus skor tertinggi kamu? Data penghargaanmu akan diulang dari awal.")) {
                localStorage.removeItem("gotong_royong_score");
                localStorage.removeItem("gotong_royong_date");
                highscore = 0;
                highscoreDate = "-";
                showToast("Data skormu telah dihapus!", "success");
                renderSkorPage();
            }
        }
    </script>

    <script>
        // Window Onload execution triggers
        window.onload = function() {
            // Initiate app into Main Menu representation
            renderMainMenu();
        };
    </script>
</body>
</html>
